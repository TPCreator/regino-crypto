# Release: on GitHub Releases › Draft a new release › tag v0.1.0 › Publish
# (or git tag v0.1.0 && git push --tags).
# Attached to the release: the backup-opening tool, software bills of materials (SBOM, CycloneDX) and checksums.
# The build runs with a read-only token and against the committed lockfiles; only the upload job can write.
name: release
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with: { toolchain: stable }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: cargo test --workspace --locked
      - run: npm ci --no-audit --no-fund && npx vitest run && npm run build:tool
        working-directory: ts
      - name: Tool in the repository matches the sources
        run: git diff --exit-code tools/open-backup.html
      - name: Software bills of materials (SBOM)
        run: |
          # SBOM tools pinned exactly: cargo-cyclonedx by version + its own Cargo.lock, cyclonedx-npm as a
          # devDependency of ts/ (exact version and integrity hash in package-lock.json, installed by npm ci)
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json
          mkdir dist
          cp vault/regino-vault.cdx.json keys/regino-keys.cdx.json dist/
          (cd ts && npx --no-install cyclonedx-npm --output-file ../dist/regino-crypto-ts.cdx.json)
          cp tools/open-backup.html dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with: { name: dist, path: dist, if-no-files-found: error }

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with: { name: dist, path: dist }
      - name: GitHub release
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          TAG: "${{ github.event.release.tag_name || github.ref_name }}"
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "regino-crypto $TAG" \
              --notes "Commit: $GITHUB_SHA. Assets: tool for opening a backup independently, software bills of materials (CycloneDX) and SHA-256 checksums."
          fi
