name: ci
on: [push, pull_request]

# Minimal permissions; actions pinned to a commit (not a tag) so they cannot be silently swapped.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with: { toolchain: stable, components: clippy }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace (including Wycheproof vectors)
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee test.log; then
            # also surface errors as public annotations (run logs cannot be downloaded without signing in)
            grep -E "panicked|error|FAILED|failed|thread '" test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

  # Dependencies: known vulnerabilities (RustSec), licenses, sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - name: cargo-deny (pinned version, verified checksum)
        run: |
          f="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$f.tar.gz"
          echo "$DENY_SHA256  deny.tgz" | sha256sum -c -
          tar xzf deny.tgz && "./$f/cargo-deny" check

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: ts } }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Vulnerable packages (npm audit)
        run: npm audit --audit-level=moderate
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage
      - name: Tool in the repository matches the sources
        run: npm run build:tool && git diff --exit-code ../tools/open-backup.html
