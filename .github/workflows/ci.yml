name: ci
on: [push, pull_request]

# Minimal permissions; actions pinned to a commit (not a tag) so they cannot be silently swapped.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with: { toolchain: stable, components: clippy }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # TEMPORARY: does the Windows stack overflow also happen in a release build?
      # (pwsh: the Git Bash perl cannot configure vendored OpenSSL)
      - name: diagnose stack overflow (temporary)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          cargo test --release -p regino-vault --test vault *> d.log
          $rc = $LASTEXITCODE
          $lines = Get-Content d.log | Where-Object { $_ -match 'test result|overflow|STATUS_|panicked|error' -and $_ -notmatch 'ERROR CORE' } | Select-Object -Last 15
          $msg = (($lines + "rc=$rc") -join '%0A')
          Write-Output "::warning title=release::$msg"
      - name: cargo test --workspace (including Wycheproof vectors)
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace --no-fail-fast 2>&1 | tee test.log; then
            # surface the cause as one public annotation (run logs cannot be downloaded without signing in;
            # GitHub keeps only 10 annotations per step, so join the lines)
            msg=$(grep -vE "ERROR CORE|Compiling|^test .* \.\.\. ok$|test result: ok" test.log \
              | grep -E "Running|panicked|FAILED|error|overflow|STATUS_|exit code|signal|^---- " | tail -40 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo test failed::$msg"
            exit 1
          fi

  # Dependencies: known vulnerabilities (RustSec), licenses, sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - name: cargo-deny (pinned version, verified checksum)
        run: |
          f="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$f.tar.gz"
          echo "$DENY_SHA256  deny.tgz" | sha256sum -c -
          tar xzf deny.tgz && "./$f/cargo-deny" check

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: ts } }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Vulnerable packages (npm audit)
        run: npm audit --audit-level=moderate
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage
      - name: Tool in the repository matches the sources
        run: npm run build:tool && git diff --exit-code ../tools/open-backup.html
