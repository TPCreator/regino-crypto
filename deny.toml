# cargo-deny: dependency check on every change (CI). Run locally: `cargo deny check`.
# Rules: known vulnerabilities (RustSec) and yanked versions fail the build; only permissive
# licenses (MIT/BSD/Apache and similar); crates only from crates.io.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Exceptions only with a justification and date; none so far.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
