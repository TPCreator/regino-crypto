# cargo-deny: dependency check on every change (CI). Run locally: `cargo deny check`.
# Rules: known vulnerabilities (RustSec) and yanked versions fail the build; only permissive
# licenses (MIT/BSD/Apache and similar); crates only from crates.io.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Exceptions only with a justification and date; none so far.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]

# sqlcipher-src (from rusqlite 0.42 / libsqlite3-sys 0.40, since 0.13.4) declares the licences of everything it
# ships: SQLCipher (BSD-3-Clause), SQLite ("blessing" – public domain, the same code as before, when it was bundled
# inside libsqlite3-sys under MIT) and libtomcrypt (WTFPL – a crypto provider we do not build: we use vendored
# OpenSSL). Allowed for this crate only.
[[licenses.exceptions]]
crate = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
