[package]
name = "regino-vault"
version = "0.11.1"
edition = "2021"
description = "Encrypted local database (SQLCipher) with the key in the OS keystore – shared by Regino apps"
authors = ["regino-crypto contributors"]
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde_json = "1"
zeroize = "1"
getrandom = "0.4"
thiserror = "2"
keyring-core = "1"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1"
