[package]
name = "regino-keys"
version = "0.20.0"
edition = "2021"
description = "Keys for Regino apps: Argon2id from a password, key wrapping (XChaCha20-Poly1305), 2-of-3 splitting (Shamir), Ed25519 signatures"
authors = ["regino-crypto contributors"]
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
blahaj = "0.7"
sha2 = { version = "0.11", features = ["zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
zeroize = "1"
subtle = "2"
getrandom = "0.4"
thiserror = "2"
ed25519-dalek = "=3.0.0"

[dev-dependencies]
serde_json = "1"
# only the traits for a test source with given Shamir coefficients (`shamir::tests`); already in Cargo.lock via blahaj/rand
rand_core = "0.10"
