[package]
name = "regino-keys"
version = "0.13.4"
edition = "2021"
description = "Keys for Regino apps: Argon2id from a password, key wrapping (XChaCha20-Poly1305), 2-of-3 splitting (Shamir), Ed25519 signatures"
authors = ["regino-crypto contributors"]
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
blahaj = "0.7"
sha2 = { version = "0.11", features = ["zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
aes-gcm = "0.11"
zeroize = "1"
subtle = "2"
getrandom = "0.4"
thiserror = "2"
ed25519-dalek = "=3.0.0"

[dev-dependencies]
serde_json = "1"
